<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formação QA Automation / SDET — Playwright API</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Highlight.js for code formatting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
  
  <!-- Marked.js for markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  
  <style>
    :root {
      --primary: #0f172a;
      --secondary: #2563eb;
      --accent: #0ea5e9;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
      --text: #1e293b;
      --text-muted: #64748b;
      --bg: #ffffff;
      --bg-alt: #f8fafc;
      --border: #e2e8f0;
      --sidebar-width: 320px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: var(--bg);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-alt);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sidebar-header {
      padding: 24px;
      border-bottom: 1px solid var(--border);
    }
    
    .sidebar-header h1 {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.3;
    }

    .sidebar-header .badge {
      display: inline-block;
      background: var(--secondary);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .sidebar-menu {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0;
    }

    .menu-item {
      padding: 12px 24px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      border-left: 3px solid transparent;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
    }

    .menu-item:hover {
      background: rgba(37, 99, 235, 0.05);
      color: var(--primary);
    }

    .menu-item.active {
      background: rgba(37, 99, 235, 0.08);
      color: var(--secondary);
      border-left-color: var(--secondary);
      font-weight: 600;
    }

    /* Main Content Area */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 40px 60px;
      background: var(--bg);
      scroll-behavior: smooth;
    }

    .content-container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Markdown Styles */
    .content-container h1 {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border);
    }

    .content-container h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      margin-top: 40px;
      margin-bottom: 16px;
    }
    
    .content-container h3 {
      font-size: 18px;
      font-weight: 600;
      color: var(--secondary);
      margin-top: 24px;
      margin-bottom: 12px;
    }

    .content-container p {
      margin-bottom: 16px;
      line-height: 1.7;
      font-size: 15px;
    }

    .content-container ul, .content-container ol {
      margin-bottom: 16px;
      margin-left: 24px;
      line-height: 1.7;
      font-size: 15px;
    }

    .content-container li {
      margin-bottom: 8px;
    }

    .content-container strong {
      color: var(--primary);
      font-weight: 600;
    }

    /* Code Blocks */
    .content-container pre {
      background: #0d1117;
      border-radius: 8px;
      padding: 16px;
      margin: 20px 0;
      overflow-x: auto;
    }

    .content-container code {
      font-family: 'Fira Code', monospace;
      font-size: 13px;
    }
    
    /* When inside a pre block, ensure text is light since background is dark */
    .content-container pre code {
      color: #e2e8f0;
      background: transparent;
      border: none;
      padding: 0;
    }

    .content-container p code, .content-container li code {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      color: #b91c1c;
      font-size: 13px;
    }

    /* Blockquotes */
    .content-container blockquote {
      border-left: 4px solid var(--secondary);
      background: rgba(37, 99, 235, 0.05);
      padding: 16px;
      margin: 20px 0;
      border-radius: 0 8px 8px 0;
    }
    
    .content-container blockquote p:last-child {
      margin-bottom: 0;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="badge">Do Intermediário ao Avançado</span>
      <h1>Formação QA Automation / SDET</h1>
      <p style="font-size: 11px; color: var(--text-muted); margin-top: 8px;">Playwright API + Arquitetura</p>
    </div>
    
    <nav class="sidebar-menu" id="menu">
      <!-- Generated via JS -->
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="content-area" id="main-content">
    <div class="content-container" id="markdown-content">
      <div class="loading">Selecione um módulo no menu lateral...</div>
    </div>
  </main>

  <script>
    // Configuration for Marked.js
    marked.setOptions({
      highlight: function(code, lang) {
        const language = hljs.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language }).value;
      },
      breaks: true
    });

    const phases = [
      { id: "00-preparacao-ambiente", title: "Fase 0: Preparação do Ambiente" },
      { id: "01-typescript-qa", title: "Fase 1: TypeScript para QA" },
      { id: "02-http-rest-apis", title: "Fase 2: HTTP + REST + APIs" },
      { id: "03-playwright-api", title: "Fase 3: Playwright API" },
      { id: "04-test-design", title: "Fase 4: Test Design" },
      { id: "05-arquitetura-framework", title: "Fase 5: Arquitetura de Framework" },
      { id: "06-api-testing-avancado", title: "Fase 6: API Testing Avançado" },
      { id: "07-postgresql-sql", title: "Fase 7: PostgreSQL + SQL" },
      { id: "08-integracao-api-banco", title: "Fase 8: Integração API + Banco" },
      { id: "09-contract-testing", title: "Fase 9: Contract Testing" },
      { id: "10-ci-cd", title: "Fase 10: CI/CD e Automação" },
      { id: "11-webhooks-assincrono", title: "Fase 11: Webhooks" },
      { id: "12-concorrencia-idempotencia", title: "Fase 12: Concorrência e Idempotência" },
      { id: "13-resiliencia-toxiproxy", title: "Fase 13: Resiliência + Toxiproxy" },
      { id: "14-seguranca-apis", title: "Fase 14: Segurança de APIs" },
      { id: "15-observabilidade", title: "Fase 15: Observabilidade" },
      { id: "16-projeto-final-sdet", title: "Fase 16: Projeto Final SDET" }
    ];

    const menuEl = document.getElementById('menu');
    const contentEl = document.getElementById('markdown-content');

    // Build Menu
    phases.forEach((phase, index) => {
      const item = document.createElement('div');
      item.className = 'menu-item';
      item.textContent = phase.title;
      item.onclick = () => loadPhase(phase.id, item);
      menuEl.appendChild(item);
    });

    async function loadPhase(id, menuItem) {
      // Update active state
      document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
      if(menuItem) menuItem.classList.add('active');

      contentEl.innerHTML = '<div class="loading">Carregando conteúdo...</div>';
      
      try {
        // Fetch the markdown file
        const response = await fetch(`fases/fase-${id}.md`);
        
        if (!response.ok) {
          throw new Error('Arquivo não encontrado');
        }
        
        const text = await response.text();
        contentEl.innerHTML = marked.parse(text);
        
        // Scroll to top
        document.getElementById('main-content').scrollTop = 0;
      } catch (error) {
        contentEl.innerHTML = `
          <div style="color: var(--danger); padding: 40px; text-align: center;">
            <h3>Erro ao carregar o módulo</h3>
            <p>Verifique se o arquivo fases/fase-${id}.md existe.</p>
          </div>
        `;
      }
    }

    // Load initial info phase (or just first phase)
    loadPhase(phases[0].id, menuEl.firstChild);

  </script>
</body>
</html>
